<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSM Portal - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Coming Soon Modern Card */
        .coming-soon-modal {
            background: rgba(255, 255, 255, 0.96);
            width: 90%;
            max-width: 380px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 2px 6px rgba(255, 255, 255, 0.9);
            text-align: center;
            border: 2px solid #e2e8f0;
            position: relative;
            backdrop-filter: blur(10px);
            animation: floatCard 3s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Top Official Status Badge */
        .status-badge {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 16px;
            letter-spacing: 1.2px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* Animated Rocket Icon */
        .coming-icon {
            font-size: 48px;
            margin-bottom: 14px;
            display: inline-block;
            animation: bounceIcon 1.5s infinite alternate;
        }

        @keyframes bounceIcon {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-6px) scale(1.05); }
        }

        /* Main Heading */
        .coming-header {
            color: #0f172a;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Descriptive Message */
        .coming-message {
            color: #475569;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .coming-message strong {
            color: #2563eb;
        }

        /* Official Action Button (Telegram / Support) */
        .action-btn {
            background: linear-gradient(135deg, #0088cc, #005f99);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            font-size: 13.5px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 6px 18px rgba(0, 136, 204, 0.4);
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #0077b3, #004d80);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 136, 204, 0.6);
        }
    </style>
</head>
<body>

    <div class="coming-soon-modal">
        <!-- Status Badge -->
        <div>
            <span class="status-badge">Official Update</span>
        </div>

        <!-- Rocket/Sparkle Icon -->
        <div class="coming-icon">🚀</div>

        <!-- Main Header -->
        <div class="coming-header">
            Coming Soon!
        </div>

        <!-- Official English Content -->
        <div class="coming-message">
            We are working hard to bring something amazing for you. Operations and new updates will <strong>commence shortly</strong>. Stay tuned with us!
        </div>

        <!-- Action Button Linked to Official Chatbot -->
        <a href="https://t.me/Vsmitwork_bot" target="_blank" class="action-btn">
            💬 Connect via Official Chatbot
        </a>
    </div>

</body>
</html>
