<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gateway - Access Restricted</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #001f3f, #004080, #001f3f);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Advanced Small Red Pulsing Popup */
        .warning-modal {
            background: rgba(255, 255, 255, 0.96);
            width: 100%;
            max-width: 380px;
            padding: 28px 22px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 2px solid #ff4d4d;
            position: relative;
            backdrop-filter: blur(10px);
            animation: redPulseModal 2s infinite ease-in-out;
        }

        @keyframes redPulseModal {
            0% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(255, 77, 77, 0.5), inset 0 0 10px rgba(255, 77, 77, 0.1);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 0 30px rgba(255, 77, 77, 0.9), inset 0 0 15px rgba(255, 77, 77, 0.2);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(255, 77, 77, 0.5), inset 0 0 10px rgba(255, 77, 77, 0.1);
            }
        }

        /* Top Status Badge */
        .status-badge {
            background-color: #ff4d4d;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 1px;
            animation: blinkBadge 1.5s infinite;
        }

        @keyframes blinkBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Warning Icon */
        .warning-icon {
            font-size: 42px;
            color: #ff4d4d;
            margin-bottom: 10px;
            animation: bounceIcon 1s infinite alternate;
        }

        @keyframes bounceIcon {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        /* Warning Header */
        .warning-header {
            color: #cc0000;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Warning Message */
        .warning-message {
            color: #2c3e50;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .warning-message strong {
            color: #004080;
        }

        .price-tag {
            color: #d9534f;
            font-size: 15px;
            font-weight: bold;
        }

        /* Action Button with Telegram Link */
        .action-btn {
            background: linear-gradient(135deg, #0088cc, #005f99); /* Telegram Blue Theme */
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #0077b3, #004d80);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
        }
    </style>
</head>
<body>

    <div class="warning-modal">
        <!-- Status Badge -->
        <div>
            <span class="status-badge">System Restriction</span>
        </div>

        <!-- Warning Icon -->
        <div class="warning-icon">⚠️</div>

        <!-- Warning Title -->
        <div class="warning-header">
            Access Verification Required
        </div>

        <!-- Official Warning Content -->
        <div class="warning-message">
            Please acquire your <strong>Instaship ID</strong> to proceed further.<br>
            Submit your request instantly through our official chatbot.<br><br>
            <span class="price-tag">ID Activation Charge: ₹999/-</span>
        </div>

        <!-- Action Button Linked to Telegram Bot -->
        <a href="https://t.me/Vsmitwork_bot" target="_blank" class="action-btn">
            🚀 Request ID via Chatbot
        </a>
    </div>

</body>
</html>
